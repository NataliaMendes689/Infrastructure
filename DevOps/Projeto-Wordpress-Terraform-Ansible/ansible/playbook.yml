---
- name: Provision WordPress on Ubuntu
  hosts: webserver
  become: true

  vars:
    wordpress_root: /var/www/wordpress
    wordpress_archive: /tmp/wordpress.tar.gz
    wordpress_db_name: wordpress
    wordpress_db_user: wordpress

  pre_tasks:
    - name: Fail early when the database password was not supplied
      ansible.builtin.assert:
        that:
          - wordpress_db_password is defined
          - wordpress_db_password | length >= 12
        fail_msg: >-
          wordpress_db_password must be provided and at least 12 characters.
          Use ansible-vault, or pass -e wordpress_db_password=...
        quiet: true

    - name: Refresh the package index
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  tasks:
    - name: Install Apache, MySQL, PHP and the MySQL client library for Ansible
      ansible.builtin.apt:
        name:
          - apache2
          - mysql-server
          - php
          - php-mysql
          - libapache2-mod-php
          - python3-pymysql
        state: present

    - name: Ensure MySQL is running and enabled
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: true

    - name: Create the WordPress database
      community.mysql.mysql_db:
        name: "{{ wordpress_db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create the WordPress database user
      community.mysql.mysql_user:
        name: "{{ wordpress_db_user }}"
        password: "{{ wordpress_db_password }}"
        priv: "{{ wordpress_db_name }}.*:ALL"
        host: localhost
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      no_log: true

    - name: Download WordPress
      ansible.builtin.get_url:
        url: https://wordpress.org/latest.tar.gz
        dest: "{{ wordpress_archive }}"
        mode: "0644"

    # creates: makes this a no-op on reruns. Without it the playbook re-extracts
    # the archive over the live site on every execution.
    - name: Extract WordPress
      ansible.builtin.unarchive:
        src: "{{ wordpress_archive }}"
        dest: /var/www/
        remote_src: true
        creates: "{{ wordpress_root }}/index.php"

    - name: Fetch unique salts from the WordPress API
      ansible.builtin.uri:
        url: https://api.wordpress.org/secret-key/1.1/salt/
        return_content: true
      register: wordpress_salts
      changed_when: false
      check_mode: false

    - name: Write wp-config.php
      ansible.builtin.template:
        src: wp-config.php.j2
        dest: "{{ wordpress_root }}/wp-config.php"
        owner: www-data
        group: www-data
        mode: "0640"
      no_log: true
      notify: Restart Apache

    - name: Own the site as www-data
      ansible.builtin.file:
        path: "{{ wordpress_root }}"
        owner: www-data
        group: www-data
        recurse: true
        state: directory

    - name: Install the Apache virtual host
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/wordpress.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          <VirtualHost *:80>
              DocumentRoot {{ wordpress_root }}
              <Directory {{ wordpress_root }}>
                  AllowOverride All
                  Require all granted
              </Directory>
              ErrorLog ${APACHE_LOG_DIR}/wordpress-error.log
              CustomLog ${APACHE_LOG_DIR}/wordpress-access.log combined
          </VirtualHost>
      notify: Restart Apache

    - name: Enable mod_rewrite, required by WordPress permalinks
      community.general.apache2_module:
        name: rewrite
        state: present
      notify: Restart Apache

    - name: Enable the WordPress site
      ansible.builtin.command: a2ensite wordpress.conf
      args:
        creates: /etc/apache2/sites-enabled/wordpress.conf
      notify: Restart Apache

    - name: Disable the default site
      ansible.builtin.command: a2dissite 000-default.conf
      args:
        removes: /etc/apache2/sites-enabled/000-default.conf
      notify: Restart Apache

  handlers:
    # A handler fires once, at the end, and only when something changed. The
    # original playbook restarted Apache unconditionally on every run.
    - name: Restart Apache
      ansible.builtin.service:
        name: apache2
        state: restarted
